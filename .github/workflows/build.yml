name: build

# Builds Glide (the Avalonia desktop app) and its updater for Windows.

on:
  workflow_call:
    inputs:
      target: # kept for callers; only 'windows' is built
        required: false
        type: string
        default: windows
      arches: # JSON list of architectures to build
        required: false
        type: string
        default: '["x64"]'

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    runs-on: windows-latest
    env:
      RID: win-${{ matrix.arch }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Set output folder
      shell: bash
      run: |
        RAW_PATH="${{ github.workspace }}/${{ matrix.arch }}"
        echo "OUTPUT=${RAW_PATH//\\//}" >> "$GITHUB_ENV"

    - name: Build AmazTool
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./AmazTool/AmazTool.csproj -c Release -r $RID -p:SelfContained=true -p:PublishTrimmed=true -p:EnableWindowsTargeting=true -o "$OUTPUT"

    - name: Build Glide
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r $RID -p:SelfContained=true -p:EnableWindowsTargeting=true -o "$OUTPUT"

    - name: Remove debug symbols
      shell: bash
      run: find "$OUTPUT" -type f -name '*.pdb' -delete

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.arch }}
        path: ${{ env.OUTPUT }}
