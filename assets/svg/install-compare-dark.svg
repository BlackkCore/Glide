<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="308" viewBox="0 0 1040 308" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191D2E"/>
      <stop offset="100%" stop-color="#101320"/>
    </linearGradient>
    <linearGradient id="rowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2338" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#141827" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="rimIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5560F5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#5560F5"/>
      <stop offset="70%" stop-color="#7B88FF"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="75%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B88FF"/>
      <stop offset="100%" stop-color="#4A55EB"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
    @keyframes floatA { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes floatB { 0%,100% { transform: translateY(1px); } 50% { transform: translateY(-3px); } }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .fA { animation: floatA 4.4s ease-in-out infinite; }
    .fB { animation: floatB 4.4s ease-in-out -1.8s infinite; }
    .dot { animation: dotPulse 2.2s ease-in-out infinite; }
  </style>

  <!-- LEFT CARD: WINDOWS INSTALLER -->
  <rect x="6" y="12" width="494" height="290" rx="22" fill="#070911"/>
  <rect x="1" y="4" width="504" height="290" rx="22" fill="url(#cardBg)" stroke="#2A314C" stroke-width="1.2"/>
  <line x1="28" y1="4.5" x2="478" y2="4.5" stroke="url(#rimIndigo)" stroke-width="1.8"/>

  <!-- Pill Badge -->
  <rect x="26" y="24" width="160" height="24" rx="12" fill="#212858" stroke="#5560F5" stroke-opacity="0.65" stroke-width="1"/>
  <circle class="dot" cx="39" cy="36" r="3.5" fill="#7B88FF"/>
  <text x="50" y="39.5" class="mono" font-size="10.5" font-weight="700" fill="#DDE2FF">RECOMMENDED · .EXE</text>

  <text x="26" y="76" class="sans" font-size="22" font-weight="800" fill="#EEF0F8">Windows Installer</text>
  <text x="26" y="99" class="sans" font-size="13" fill="#8C97B0">Standard desktop setup with tray autostart &amp; clean updates.</text>

  <!-- Floating 3D Glide App Tile -->
  <g transform="translate(442, 58)">
    <g class="fA">
      <ellipse cx="0" cy="4" rx="34" ry="12" transform="rotate(-12)" stroke="#5560F5" stroke-opacity="0.35" stroke-width="1.1" fill="none"/>
      <rect x="-22" y="-17" width="44" height="44" rx="13" fill="#272F8A"/>
      <rect x="-22" y="-22" width="44" height="44" rx="13" fill="url(#tileGrad)" stroke="#9AA4FF" stroke-opacity="0.65" stroke-width="1"/>
      <path d="M -9 -6 C -1 -9 6 -5 10 3 C 3 0 -4 1 -8 8 C -7 1 -8 -3 -9 -6 Z" fill="url(#wingGrad)"/>
      <path d="M -6 8 C 1 5 6 5 11 9 C 4 10 -1 11 -6 8 Z" fill="#22D3EE" fill-opacity="0.85"/>
    </g>
  </g>

  <!-- Installer Spec Rows -->
  <g transform="translate(26, 120)">
    <rect x="0" y="0" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#252C44" stroke-width="1"/>
    <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#8C97B0">App folder</text>
    <text x="440" y="22" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#D5DCFF">%ProgramFiles%\Glide</text>

    <rect x="0" y="44" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#252C44" stroke-width="1"/>
    <text x="14" y="66" class="sans" font-size="12" font-weight="600" fill="#8C97B0">User config</text>
    <text x="440" y="66" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#D5DCFF">%LOCALAPPDATA%\Glide</text>

    <rect x="0" y="88" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#252C44" stroke-width="1"/>
    <text x="14" y="110" class="sans" font-size="12" font-weight="600" fill="#8C97B0">Integration</text>
    <text x="440" y="110" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#22D3EE">Start Menu · Tray · vless:// links</text>

    <rect x="0" y="132" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#252C44" stroke-width="1"/>
    <text x="14" y="154" class="sans" font-size="12" font-weight="600" fill="#8C97B0">Uninstall</text>
    <text x="440" y="154" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#34D399">Windows Installed Apps · clean</text>
  </g>

  <!-- RIGHT CARD: PORTABLE ARCHIVE -->
  <rect x="540" y="12" width="494" height="290" rx="22" fill="#070911"/>
  <rect x="535" y="4" width="504" height="290" rx="22" fill="url(#cardBg)" stroke="#263147" stroke-width="1.2"/>
  <line x1="562" y1="4.5" x2="1012" y2="4.5" stroke="url(#rimTeal)" stroke-width="1.8"/>

  <rect x="560" y="24" width="142" height="24" rx="12" fill="#102730" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1"/>
  <circle class="dot" cx="573" cy="36" r="3.5" fill="#22D3EE"/>
  <text x="584" y="39.5" class="mono" font-size="10.5" font-weight="700" fill="#A5F3FC">PORTABLE · .ZIP</text>

  <text x="560" y="76" class="sans" font-size="22" font-weight="800" fill="#EEF0F8">Portable Archive</text>
  <text x="560" y="99" class="sans" font-size="13" fill="#8C97B0">Extract to any folder or USB drive — leave zero system trace.</text>

  <!-- Floating 3D Portable Vault Capsule -->
  <g transform="translate(976, 58)">
    <g class="fB">
      <ellipse cx="0" cy="4" rx="34" ry="12" transform="rotate(12)" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.1" fill="none"/>
      <rect x="-24" y="-15" width="48" height="40" rx="12" fill="#0B222D"/>
      <rect x="-24" y="-20" width="48" height="40" rx="12" fill="#192338" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="1.2"/>
      <!-- USB / Archive Top Tab -->
      <rect x="-12" y="-11" width="24" height="7" rx="3.5" fill="#22D3EE" fill-opacity="0.28" stroke="#22D3EE" stroke-width="0.9"/>
      <rect x="-13" y="2" width="26" height="9" rx="4.5" fill="#0F172A" stroke="#34D399" stroke-opacity="0.7" stroke-width="1"/>
      <circle cx="-5" cy="6.5" r="2.2" fill="#34D399"/>
      <line x1="1" y1="6.5" x2="9" y2="6.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Portable Spec Rows -->
  <g transform="translate(560, 120)">
    <rect x="0" y="0" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#232D42" stroke-width="1"/>
    <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#8C97B0">App folder</text>
    <text x="440" y="22" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#D5DCFF">C:\Glide (any folder or USB)</text>

    <rect x="0" y="44" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#232D42" stroke-width="1"/>
    <text x="14" y="66" class="sans" font-size="12" font-weight="600" fill="#8C97B0">User config</text>
    <text x="440" y="66" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#D5DCFF">guiConfigs\ (next to Glide.exe)</text>

    <rect x="0" y="88" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#232D42" stroke-width="1"/>
    <text x="14" y="110" class="sans" font-size="12" font-weight="600" fill="#8C97B0">Registry footprint</text>
    <text x="440" y="110" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#22D3EE">Zero keys written anywhere</text>

    <rect x="0" y="132" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#232D42" stroke-width="1"/>
    <text x="14" y="154" class="sans" font-size="12" font-weight="600" fill="#8C97B0">Removal</text>
    <text x="440" y="154" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#34D399">Delete folder · completely gone</text>
  </g>
</svg>