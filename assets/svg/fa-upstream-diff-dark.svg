  <rect x="234" y="22" width="192" height="24" rx="12" fill="#112630" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1"/>
  <circle class="dot" cx="413" cy="34" r="3.5" fill="#22D3EE"/>
  <text x="402" y="37.5" text-anchor="end" class="sans" font-size="11" font-weight="700" fill="#A5F3FC">لایهٔ بازطراحی‌شده</text>
