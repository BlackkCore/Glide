<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="220" viewBox="0 0 1040 220" fill="none">
  <defs>
    <linearGradient id="footBgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F4FB"/>
    </linearGradient>
    <radialGradient id="footGlowL" cx="76%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#0E7490" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="footGlobeL" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#E3E8FF"/>
      <stop offset="100%" stop-color="#5A67FF" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="footDotsL" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#4350F2" fill-opacity="0.45"/>
    </pattern>
    <linearGradient id="rimL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4350F2"/>
      <stop offset="60%" stop-color="#5A67FF"/>
      <stop offset="85%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btnTopL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A67FF"/>
      <stop offset="50%" stop-color="#4350F2"/>
      <stop offset="100%" stop-color="#3541E0"/>
    </linearGradient>
    <linearGradient id="sheenL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="footClipL"><rect x="1" y="4" width="1038" height="204" rx="24"/></clipPath>
    <clipPath id="btnClipL"><rect x="0" y="0" width="292" height="50" rx="25"/></clipPath>
    <clipPath id="fgClipL"><circle cx="0" cy="0" r="96"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
    @keyframes floatBtn { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
    @keyframes glint { 0% { transform: translateX(-160px); } 100% { transform: translateX(420px); } }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .fBtn { animation: floatBtn 4.4s ease-in-out infinite; }
    .glint { animation: glint 4.6s ease-in-out infinite; }
    .dot { animation: dotPulse 2s ease-in-out infinite; }
  </style>

  <!-- 3D Extruded Light Ceramic Footer Shell -->
  <rect x="6" y="12" width="1028" height="204" rx="24" fill="#DCE1F0"/>
  <rect x="1" y="4" width="1038" height="204" rx="24" fill="url(#footBgL)" stroke="#CFD6EA" stroke-width="1.2"/>

  <g clip-path="url(#footClipL)">
    <rect x="1" y="4" width="1038" height="204" fill="url(#footGlowL)"/>
    <g transform="translate(838, 128)">
      <circle cx="0" cy="0" r="102" fill="#4350F2" fill-opacity="0.08"/>
      <circle cx="0" cy="0" r="96" fill="url(#footGlobeL)" fill-opacity="0.72"/>
      <g clip-path="url(#fgClipL)">
        <circle cx="0" cy="0" r="96" fill="url(#footDotsL)" fill-opacity="0.7"/>
        <text x="0" y="14" text-anchor="middle" class="sans" font-size="38" font-weight="800" letter-spacing="8" fill="#4350F2" fill-opacity="0.12">GLIDE</text>
      </g>
      <circle cx="0" cy="0" r="96" stroke="#4350F2" stroke-opacity="0.35" stroke-width="1.3"/>
      <ellipse cx="0" cy="-6" rx="134" ry="34" transform="rotate(-14)" stroke="#0E7490" stroke-opacity="0.3" stroke-width="1.2" fill="none"/>
      <path id="footOrbL" d="M -134 -6 A 134 34 -14 1 1 134 -6 A 134 34 -14 1 1 -134 -6 Z" fill="none"/>
      <circle r="3" fill="#0E7490"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#footOrbL"/></animateMotion></circle>
    </g>
  </g>

  <line x1="28" y1="4.5" x2="1012" y2="4.5" stroke="url(#rimL)" stroke-width="1.8"/>

  <g transform="translate(36, 36)">
    <rect x="0" y="0" width="224" height="24" rx="12" fill="#ECEFFF" stroke="#4350F2" stroke-opacity="0.4" stroke-width="1"/>
    <circle class="dot" cx="13" cy="12" r="3.5" fill="#047857"/>
    <text x="24" y="15.5" class="mono" font-size="10.5" font-weight="700" fill="#2B37B8">BLACKCORE · GPL-3.0 LICENSE</text>

    <text x="0" y="64" class="sans" font-size="25" font-weight="800" fill="#0B0F1D">Fast, quiet, built for everyday traffic.</text>
    <text x="0" y="94" class="sans" font-size="13.5" fill="#353F58">Windows 10 &amp; 11 (x64 · x86) · Signed installer &amp; portable builds with upstream cores.</text>
    <text x="0" y="128" class="mono" font-size="11.5" fill="#566079">Xray · sing-box · mihomo  ·  EN &amp; فارسی RTL  ·  Zero telemetry</text>
  </g>

  <g transform="translate(708, 72)">
    <g class="fBtn">
      <rect x="2" y="6" width="290" height="50" rx="25" fill="#1E278E"/>
      <rect x="0" y="0" width="292" height="50" rx="25" fill="url(#btnTopL)" stroke="#818CF8" stroke-width="1.2"/>
      <g clip-path="url(#btnClipL)">
        <rect class="glint" x="0" y="0" width="120" height="50" fill="url(#sheenL)"/>
      </g>
      <circle cx="28" cy="25" r="10" fill="#FFFFFF" fill-opacity="0.18"/>
      <path d="M 28 19 L 28 24 M 24.2 21.5 A 5.2 5.2 0 1 0 31.8 21.5" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <text x="48" y="29.5" class="sans" font-size="14.5" font-weight="800" fill="#FFFFFF">Download Latest Release  →</text>
    </g>
    <text x="146" y="76" text-anchor="middle" class="mono" font-size="10.5" fill="#4350F2">GitHub Releases · Verified SHA256</text>
  </g>
</svg>