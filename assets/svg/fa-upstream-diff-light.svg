    <circle cx="386" cy="62" r="3.5" fill="#4350F2"/>
    <text x="372" y="66" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#0B0F1D">پراکسی سیستم و تونل تمام‌دستگاه</text>
    <text x="14" y="66" text-anchor="start" class="mono" font-size="10.5" font-weight="600" fill="#4350F2">System Proxy · TUN</text>

    <rect x="0" y="88" width="402" height="36" rx="10" fill="url(#chipBg)" stroke="#D4DCF0" stroke-width="1"/>
    <circle cx="386" cy="106" r="3.5" fill="#4350F2"/>
    <text x="372" y="110" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#0B0F1D">اشتراک‌ها، قوانین مسیر و سرویس پس‌زمینه</text>

