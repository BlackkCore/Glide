    <circle cx="386" cy="62" r="3.5" fill="#22D3EE"/>
    <text x="372" y="66" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#EEF0F8">پوستهٔ شب و روز به همراه تقویم شمسی</text>
    <text x="14" y="66" text-anchor="start" class="mono" font-size="10.5" font-weight="700" fill="#22D3EE">RTL · EN</text>

    <rect x="0" y="88" width="402" height="36" rx="10" fill="url(#chipBg)" stroke="#26324A" stroke-width="1"/>
    <circle cx="386" cy="106" r="3.5" fill="#7B88FF"/>
    <text x="372" y="110" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#EEF0F8">جستجوی سریع، منتخب‌ها و منوی سینی</text>
    <text x="14" y="110" text-anchor="start" class="mono" font-size="10.5" font-weight="700" fill="#A5B4FC">Ctrl+K</text>

    <rect x="0" y="132" width="402" height="24" rx="8" fill="#102129" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1"/>
    <text x="201" y="148" text-anchor="middle" class="mono" font-size="10.5" fill="#A5F3FC">Ed25519 manifest verification + built-in health check</text>
