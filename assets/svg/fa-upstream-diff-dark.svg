    <text x="372" y="22" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#EEF0F8">تأیید ترافیک واقعی با سنجش پاسخ خروجی</text>
    <text x="14" y="22" text-anchor="start" class="mono" font-size="10.5" font-weight="700" fill="#34D399">38 ms</text>

