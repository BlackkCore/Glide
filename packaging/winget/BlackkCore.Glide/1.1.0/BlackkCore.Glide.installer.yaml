  - Architecture: x86
    InstallerUrl: https://github.com/BlackkCore/Glide/releases/download/1.1.0/Glide-setup-x86.exe
    InstallerSha256: <fill from the released installer before submitting>
ManifestType: installer
ManifestVersion: 1.6.0
