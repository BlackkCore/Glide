<svg xmlns="http://www.w3.org/2000/svg" width="244" height="56" viewBox="0 0 244 56" fill="none">
  <defs>
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191D2D"/>
      <stop offset="100%" stop-color="#121522"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .dot { animation: dotPulse 2s ease-in-out infinite; }
  </style>
  <!-- 3D Rounded Glass Pill Matching Glide Secondary Controls -->
  <rect x="2" y="7" width="240" height="46" rx="23" fill="#090B13"/>
  <rect x="2.75" y="2.75" width="238.5" height="44.5" rx="22.25" fill="url(#pillBg)" stroke="#2E3654" stroke-width="1.3"/>
  <path d="M 24 3.4 L 220 3.4" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
  <rect x="21" y="17" width="14" height="16" rx="3.5" stroke="#22D3EE" stroke-width="1.8"/>
  <line x1="25" y1="22" x2="31" y2="22" stroke="#22D3EE" stroke-width="1.6"/>
  <circle class="dot" cx="28" cy="28" r="1.6" fill="#22D3EE"/>
  <text x="45" y="30" class="sans" font-size="14.5" font-weight="700" fill="#EEF0F8">Portable zip (x64)</text>
</svg>