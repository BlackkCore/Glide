<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="308" viewBox="0 0 1040 308" fill="none">
  <defs>
    <linearGradient id="cardBgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F7FC"/>
    </linearGradient>
    <linearGradient id="rowBgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF2FA"/>
    </linearGradient>
    <linearGradient id="rimIndigoL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4350F2"/>
      <stop offset="70%" stop-color="#5A67FF"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimTealL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0E7490"/>
      <stop offset="75%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileGradL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A67FF"/>
      <stop offset="100%" stop-color="#3541E0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
    @keyframes floatA { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes floatB { 0%,100% { transform: translateY(1px); } 50% { transform: translateY(-3px); } }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .fA { animation: floatA 4.4s ease-in-out infinite; }
    .fB { animation: floatB 4.4s ease-in-out -1.8s infinite; }
    .dot { animation: dotPulse 2.2s ease-in-out infinite; }
  </style>

  <!-- LEFT CARD: WINDOWS INSTALLER -->
  <rect x="6" y="12" width="494" height="290" rx="22" fill="#DCE1F0"/>
  <rect x="1" y="4" width="504" height="290" rx="22" fill="url(#cardBgL)" stroke="#CFD6EA" stroke-width="1.2"/>
  <line x1="28" y1="4.5" x2="478" y2="4.5" stroke="url(#rimIndigoL)" stroke-width="1.8"/>

  <rect x="26" y="24" width="160" height="24" rx="12" fill="#ECEFFF" stroke="#4350F2" stroke-opacity="0.4" stroke-width="1"/>
  <circle class="dot" cx="39" cy="36" r="3.5" fill="#4350F2"/>
  <text x="50" y="39.5" class="mono" font-size="10.5" font-weight="700" fill="#2B37B8">RECOMMENDED · .EXE</text>

  <text x="26" y="76" class="sans" font-size="22" font-weight="800" fill="#0B0F1D">Windows Installer</text>
  <text x="26" y="99" class="sans" font-size="13" fill="#566079">Standard desktop setup with tray autostart &amp; clean updates.</text>

  <g transform="translate(442, 58)">
    <g class="fA">
      <ellipse cx="0" cy="4" rx="34" ry="12" transform="rotate(-12)" stroke="#4350F2" stroke-opacity="0.28" stroke-width="1.1" fill="none"/>
      <rect x="-22" y="-17" width="44" height="44" rx="13" fill="#232B85"/>
      <rect x="-22" y="-22" width="44" height="44" rx="13" fill="url(#tileGradL)" stroke="#818CF8" stroke-width="1"/>
      <path d="M -9 -6 C -1 -9 6 -5 10 3 C 3 0 -4 1 -8 8 C -7 1 -8 -3 -9 -6 Z" fill="#FFFFFF"/>
      <path d="M -6 8 C 1 5 6 5 11 9 C 4 10 -1 11 -6 8 Z" fill="#A5F3FC"/>
    </g>
  </g>

  <g transform="translate(26, 120)">
    <rect x="0" y="0" width="454" height="36" rx="10" fill="url(#rowBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#566079">App folder</text>
    <text x="440" y="22" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#0B0F1D">%ProgramFiles%\Glide</text>

    <rect x="0" y="44" width="454" height="36" rx="10" fill="url(#rowBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <text x="14" y="66" class="sans" font-size="12" font-weight="600" fill="#566079">User config</text>
    <text x="440" y="66" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#0B0F1D">%LOCALAPPDATA%\Glide</text>

    <rect x="0" y="88" width="454" height="36" rx="10" fill="url(#rowBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <text x="14" y="110" class="sans" font-size="12" font-weight="600" fill="#566079">Integration</text>
    <text x="440" y="110" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#4350F2">Start Menu · Tray · vless:// links</text>

    <rect x="0" y="132" width="454" height="36" rx="10" fill="url(#rowBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <text x="14" y="154" class="sans" font-size="12" font-weight="600" fill="#566079">Uninstall</text>
    <text x="440" y="154" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#047857">Windows Installed Apps · clean</text>
  </g>

  <!-- RIGHT CARD: PORTABLE ARCHIVE -->
  <rect x="540" y="12" width="494" height="290" rx="22" fill="#DCE1F0"/>
  <rect x="535" y="4" width="504" height="290" rx="22" fill="url(#cardBgL)" stroke="#CFD6EA" stroke-width="1.2"/>
  <line x1="562" y1="4.5" x2="1012" y2="4.5" stroke="url(#rimTealL)" stroke-width="1.8"/>

  <rect x="560" y="24" width="142" height="24" rx="12" fill="#E6F6F9" stroke="#0E7490" stroke-opacity="0.4" stroke-width="1"/>
  <circle class="dot" cx="573" cy="36" r="3.5" fill="#0E7490"/>
  <text x="584" y="39.5" class="mono" font-size="10.5" font-weight="700" fill="#0E7490">PORTABLE · .ZIP</text>

  <text x="560" y="76" class="sans" font-size="22" font-weight="800" fill="#0B0F1D">Portable Archive</text>
  <text x="560" y="99" class="sans" font-size="13" fill="#566079">Extract to any folder or USB drive — leave zero system trace.</text>

  <g transform="translate(976, 58)">
    <g class="fB">
      <ellipse cx="0" cy="4" rx="34" ry="12" transform="rotate(12)" stroke="#0E7490" stroke-opacity="0.28" stroke-width="1.1" fill="none"/>
      <rect x="-24" y="-15" width="48" height="40" rx="12" fill="#CBD5E8"/>
      <rect x="-24" y="-20" width="48" height="40" rx="12" fill="#FFFFFF" stroke="#0E7490" stroke-opacity="0.65" stroke-width="1.2"/>
      <rect x="-12" y="-11" width="24" height="7" rx="3.5" fill="#E6F6F9" stroke="#0E7490" stroke-width="0.9"/>
      <rect x="-13" y="2" width="26" height="9" rx="4.5" fill="#F1F5F9" stroke="#047857" stroke-opacity="0.55" stroke-width="1"/>
      <circle cx="-5" cy="6.5" r="2.2" fill="#047857"/>
      <line x1="1" y1="6.5" x2="9" y2="6.5" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(560, 120)">
    <rect x="0" y="0" width="454" height="36" rx="10" fill="url(#rowBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#566079">App folder</text>
    <text x="440" y="22" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#0B0F1D">C:\Glide (any folder or USB)</text>

    <rect x="0" y="44" width="454" height="36" rx="10" fill="url(#rowBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <text x="14" y="66" class="sans" font-size="12" font-weight="600" fill="#566079">User config</text>
    <text x="440" y="66" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#0B0F1D">guiConfigs\ (next to Glide.exe)</text>

    <rect x="0" y="88" width="454" height="36" rx="10" fill="url(#rowBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <text x="14" y="110" class="sans" font-size="12" font-weight="600" fill="#566079">Registry footprint</text>
    <text x="440" y="110" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#0E7490">Zero keys written anywhere</text>

    <rect x="0" y="132" width="454" height="36" rx="10" fill="url(#rowBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <text x="14" y="154" class="sans" font-size="12" font-weight="600" fill="#566079">Removal</text>
    <text x="440" y="154" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#047857">Delete folder · completely gone</text>
  </g>
</svg>