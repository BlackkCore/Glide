      <path d="M -52 0 A 52 15 0 0 1 52 0" transform="rotate(-16)" stroke="#0E7490" stroke-opacity="0.3" stroke-width="1.3" fill="none"/>
      <circle cx="0" cy="0" r="34" fill="url(#coreGlobe)"/>
      <g clip-path="url(#coreGlobeClip)">
