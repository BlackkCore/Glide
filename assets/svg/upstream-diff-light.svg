<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="296" viewBox="0 0 1040 296" fill="none">
  <defs>
    <linearGradient id="cardBgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F7FC"/>
    </linearGradient>
    <linearGradient id="chipBgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF2FA"/>
    </linearGradient>
    <linearGradient id="rimIndigoL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0"/>
      <stop offset="35%" stop-color="#4350F2"/>
      <stop offset="75%" stop-color="#5A67FF"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimAuroraL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A67FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#5A67FF"/>
      <stop offset="70%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlobeL" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#DFE5FF"/>
      <stop offset="100%" stop-color="#4350F2" stop-opacity="0.82"/>
    </radialGradient>
    <pattern id="coreDotsL" width="4.5" height="4.5" patternUnits="userSpaceOnUse">
      <circle cx="1.8" cy="1.8" r="0.9" fill="#4350F2" fill-opacity="0.5"/>
    </pattern>
    <clipPath id="coreGlobeClipL"><circle cx="0" cy="0" r="34"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
    @keyframes floatMid { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .fMid { animation: floatMid 4.2s ease-in-out infinite; }
    .dot { animation: dotPulse 2.2s ease-in-out infinite; }
  </style>

  <!-- Smooth Bezier Conduits -->
  <path id="fuseAL" d="M 442 104 C 482 104 488 148 520 148 C 552 148 558 104 598 104" stroke="#4350F2" stroke-opacity="0.38" stroke-width="1.8" fill="none"/>
  <path id="fuseBL" d="M 442 148 L 598 148" stroke="#5A67FF" stroke-opacity="0.55" stroke-width="2.2" fill="none"/>
  <path id="fuseCL" d="M 442 192 C 482 192 488 148 520 148 C 552 148 558 192 598 192" stroke="#0E7490" stroke-opacity="0.42" stroke-width="1.8" fill="none"/>

  <circle r="3.2" fill="#4350F2"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#fuseAL"/></animateMotion></circle>
  <circle r="3.6" fill="#0B0F1D"><animateMotion dur="2.1s" repeatCount="indefinite"><mpath href="#fuseBL"/></animateMotion></circle>
  <circle r="3.2" fill="#0E7490"><animateMotion dur="2.8s" begin="0.8s" repeatCount="indefinite"><mpath href="#fuseCL"/></animateMotion></circle>

  <!-- LEFT CARD -->
  <rect x="6" y="12" width="438" height="278" rx="22" fill="#DCE1F0"/>
  <rect x="1" y="4" width="448" height="278" rx="22" fill="url(#cardBgL)" stroke="#CFD6EA" stroke-width="1.2"/>
  <line x1="28" y1="4.5" x2="422" y2="4.5" stroke="url(#rimIndigoL)" stroke-width="1.8"/>

  <rect x="24" y="22" width="174" height="24" rx="12" fill="#ECEFFF" stroke="#4350F2" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="37" cy="34" r="3.5" fill="#4350F2"/>
  <text x="48" y="37.5" class="mono" font-size="10.5" font-weight="700" fill="#2B37B8">UPSTREAM FOUNDATION</text>

  <text x="24" y="72" class="sans" font-size="20" font-weight="800" fill="#0B0F1D">v2rayN Routing Core</text>
  <text x="24" y="93" class="sans" font-size="12.5" fill="#566079">Proven multi-protocol plumbing preserved intact.</text>

  <g transform="translate(24, 112)">
    <rect x="0" y="0" width="402" height="36" rx="10" fill="url(#chipBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <circle cx="16" cy="18" r="3.5" fill="#4350F2"/>
    <text x="30" y="22" class="sans" font-size="12.5" font-weight="600" fill="#0B0F1D">Three engines: Xray, sing-box, mihomo</text>

    <rect x="0" y="44" width="402" height="36" rx="10" fill="url(#chipBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <circle cx="16" cy="62" r="3.5" fill="#4350F2"/>
    <text x="30" y="66" class="sans" font-size="12.5" font-weight="600" fill="#0B0F1D">System proxy hooks &amp; full-device TUN mode</text>

    <rect x="0" y="88" width="402" height="36" rx="10" fill="url(#chipBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <circle cx="16" cy="106" r="3.5" fill="#4350F2"/>
    <text x="30" y="110" class="sans" font-size="12.5" font-weight="600" fill="#0B0F1D">Subscriptions, routing rules &amp; Windows tray core</text>

    <rect x="0" y="132" width="402" height="24" rx="8" fill="#F1F4FA" stroke="#D7DDF0" stroke-width="1"/>
    <text x="201" y="148" text-anchor="middle" class="mono" font-size="10.5" fill="#566079">GPL-3.0 upstream sync · upstream protocols untouched</text>
  </g>

  <!-- RIGHT CARD -->
  <rect x="596" y="12" width="438" height="278" rx="22" fill="#DCE1F0"/>
  <rect x="591" y="4" width="448" height="278" rx="22" fill="url(#cardBgL)" stroke="#CFD6EA" stroke-width="1.2"/>
  <line x1="618" y1="4.5" x2="1012" y2="4.5" stroke="url(#rimAuroraL)" stroke-width="1.8"/>

  <rect x="614" y="22" width="194" height="24" rx="12" fill="#E6F6F9" stroke="#0E7490" stroke-opacity="0.4" stroke-width="1"/>
  <circle class="dot" cx="627" cy="34" r="3.5" fill="#0E7490"/>
  <text x="638" y="37.5" class="mono" font-size="10.5" font-weight="700" fill="#0E7490">GLIDE LAYER · REBUILT UX</text>

  <text x="614" y="72" class="sans" font-size="20" font-weight="800" fill="#0B0F1D">What Glide Rebuilds</text>
  <text x="614" y="93" class="sans" font-size="12.5" fill="#566079">Calm desktop craft layered cleanly over the core.</text>

  <g transform="translate(614, 112)">
    <rect x="0" y="0" width="402" height="36" rx="10" fill="url(#chipBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <circle cx="16" cy="18" r="3.5" fill="#047857"/>
    <text x="30" y="22" class="sans" font-size="12.5" font-weight="600" fill="#0B0F1D">Real-traffic verification (Traffic Verified · 38 ms)</text>

    <rect x="0" y="44" width="402" height="36" rx="10" fill="url(#chipBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <circle cx="16" cy="62" r="3.5" fill="#0E7490"/>
    <text x="30" y="66" class="sans" font-size="12.5" font-weight="600" fill="#0B0F1D">Midnight Aurora &amp; Light UI + full EN / فارسی RTL</text>

    <rect x="0" y="88" width="402" height="36" rx="10" fill="url(#chipBgL)" stroke="#D7DDF0" stroke-width="1"/>
    <circle cx="16" cy="106" r="3.5" fill="#4350F2"/>
    <text x="30" y="110" class="sans" font-size="12.5" font-weight="600" fill="#0B0F1D">Ctrl+K command search, favourites &amp; tray flyout</text>

    <rect x="0" y="132" width="402" height="24" rx="8" fill="#E6F6F9" stroke="#0E7490" stroke-opacity="0.32" stroke-width="1"/>
    <text x="201" y="148" text-anchor="middle" class="mono" font-size="10.5" fill="#0E7490">Ed25519 manifest verification + built-in health check</text>
  </g>

  <!-- CENTER 3D DOTTED AURORA FUSION GLOBE HUB -->
  <g transform="translate(520, 148)">
    <g class="fMid">
      <circle cx="0" cy="0" r="44" fill="#4350F2" fill-opacity="0.10"/>
      <path d="M -52 0 A 52 15 0 0 1 52 0" transform="rotate(-16)" stroke="#0E7490" stroke-opacity="0.35" stroke-width="1.3" fill="none"/>
      <circle cx="0" cy="0" r="34" fill="url(#coreGlobeL)"/>
      <g clip-path="url(#coreGlobeClipL)">
        <circle cx="0" cy="0" r="34" fill="url(#coreDotsL)"/>
        <path d="M -36 10 C -14 3 14 3 36 10 L 36 36 L -36 36 Z" fill="#D4DBF5" fill-opacity="0.65"/>
      </g>
      <circle cx="0" cy="0" r="34" stroke="#4350F2" stroke-width="1.5"/>
      <path d="M -52 0 A 52 15 0 0 0 52 0" transform="rotate(-16)" stroke="#0E7490" stroke-opacity="0.82" stroke-width="1.6" fill="none"/>
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#4350F2" stroke-width="1.3"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#4350F2" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#0E7490" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>