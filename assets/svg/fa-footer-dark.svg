<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="220" viewBox="0 0 1040 220" fill="none" role="img" aria-label="دریافت آخرین نسخه گلاید برای ویندوز">
  <defs>
    <linearGradient id="footBg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191D2E"/>
      <stop offset="100%" stop-color="#0F1220"/>
    </linearGradient>
    <radialGradient id="footGlow" cx="24%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#5560F5" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="footGlobe" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#353E82" stop-opacity="0.88"/>
      <stop offset="68%" stop-color="#14182E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7B88FF" stop-opacity="0.8"/>
    </radialGradient>
    <pattern id="footDots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#A5B4FC" fill-opacity="0.58"/>
    </pattern>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#5560F5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#5560F5"/>
      <stop offset="60%" stop-color="#7B88FF"/>
      <stop offset="85%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btnTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B88FF"/>
      <stop offset="50%" stop-color="#5560F5"/>
      <stop offset="100%" stop-color="#4550E6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="footClip"><rect x="1" y="4" width="1038" height="204" rx="24"/></clipPath>
    <clipPath id="btnClip"><rect x="0" y="0" width="292" height="50" rx="25"/></clipPath>
    <clipPath id="fgClip"><circle cx="0" cy="0" r="96"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Vazirmatn', 'Manrope', 'Segoe UI', Tahoma, -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
    @keyframes floatBtn { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
    @keyframes glint { 0% { transform: translateX(420px); } 100% { transform: translateX(-160px); } }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .fBtn { animation: floatBtn 4.4s ease-in-out infinite; }
    .glint { animation: glint 4.6s ease-in-out infinite; }
    .dot { animation: dotPulse 2s ease-in-out infinite; }
  </style>

  <rect x="6" y="12" width="1028" height="204" rx="24" fill="#070911"/>
  <rect x="1" y="4" width="1038" height="204" rx="24" fill="url(#footBg)" stroke="#2A314C" stroke-width="1.2"/>

  <g clip-path="url(#footClip)">
    <rect x="1" y="4" width="1038" height="204" fill="url(#footGlow)"/>
    <g transform="translate(202, 128)">
      <circle cx="0" cy="0" r="102" fill="#5560F5" fill-opacity="0.14"/>
      <circle cx="0" cy="0" r="96" fill="url(#footGlobe)" fill-opacity="0.72"/>
      <g clip-path="url(#fgClip)">
        <circle cx="0" cy="0" r="96" fill="url(#footDots)" fill-opacity="0.72"/>
        <text x="0" y="14" text-anchor="middle" class="sans" font-size="38" font-weight="800" letter-spacing="8" fill="#A5B4FC" fill-opacity="0.14">GLIDE</text>
      </g>
      <circle cx="0" cy="0" r="96" stroke="#7B88FF" stroke-opacity="0.45" stroke-width="1.3"/>
      <ellipse cx="0" cy="-6" rx="134" ry="34" transform="rotate(14)" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
      <path id="footOrb" d="M -134 -6 A 134 34 14 1 1 134 -6 A 134 34 14 1 1 -134 -6 Z" fill="none"/>
      <circle r="3" fill="#22D3EE"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#footOrb"/></animateMotion></circle>
    </g>
  </g>

  <line x1="28" y1="4.5" x2="1012" y2="4.5" stroke="url(#rim)" stroke-width="1.8"/>

  <g transform="translate(1004, 36)">
    <rect x="-224" y="0" width="224" height="24" rx="12" fill="#1F2542" stroke="#5560F5" stroke-opacity="0.55" stroke-width="1"/>
    <circle class="dot" cx="-13" cy="12" r="3.5" fill="#34D399"/>
    <text x="-24" y="15.5" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#DDE2FF">BLACKCORE · GPL-3.0 LICENSE</text>

    <text x="0" y="64" text-anchor="end" class="sans" font-size="25" font-weight="800" fill="#EEF0F8">سریع، آرام و ساخته شده برای استفادهٔ روزمره</text>
    <text x="0" y="94" text-anchor="end" class="sans" font-size="13.5" fill="#B9C3D9">نسخه‌های نصبی و قابل‌حمل ویندوز ۱۰ و ۱۱ با هسته‌های به‌روز و امضاشده</text>
    <text x="0" y="128" text-anchor="end" class="mono" font-size="11.5" fill="#8C97B0">Xray · sing-box · mihomo · EN &amp; RTL · Zero telemetry</text>
  </g>

  <g transform="translate(40, 72)">
    <g class="fBtn">
      <rect x="2" y="6" width="290" height="50" rx="25" fill="#232A85"/>
      <rect x="0" y="0" width="292" height="50" rx="25" fill="url(#btnTop)" stroke="#A5B4FC" stroke-opacity="0.7" stroke-width="1.2"/>
      <g clip-path="url(#btnClip)">
        <rect class="glint" x="0" y="0" width="120" height="50" fill="url(#sheen)"/>
      </g>
      <circle cx="264" cy="25" r="10" fill="#FFFFFF" fill-opacity="0.16"/>
      <path d="M 264 19 L 264 24 M 260.2 21.5 A 5.2 5.2 0 1 0 267.8 21.5" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <text x="242" y="29.5" text-anchor="end" class="sans" font-size="14.5" font-weight="800" fill="#FFFFFF">دریافت آخرین نسخه</text>
      <path d="M 38 25 H 24 M 29 20 L 23.5 25 L 29 30" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="146" y="76" text-anchor="middle" class="mono" font-size="10.5" fill="#9AA4FF">GitHub Releases · Verified SHA256</text>
  </g>
</svg>
