name: Code Test

on:
  push:
    branches:
      - master
    paths:
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.UdpTest/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/v2rayN.Desktop/**'
      - 'v2rayN/AmazTool/**'
      - 'v2rayN/GlobalHotKeys/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - 'scripts/cores/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.UdpTest/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/v2rayN.Desktop/**'
      - 'v2rayN/AmazTool/**'
      - 'v2rayN/GlobalHotKeys/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/test.yml'

permissions:
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'
        dotnet-quality: 'ga'

    # The signed engine index generator (offline: synthetic releases, a stub gh, throwaway keys).
    - name: Engine index tool self-tests
      run: node --test scripts/cores/*.test.mjs

    - name: Test Code
      run: dotnet test --project ./v2rayN/ServiceLib.Tests -c Release --results-directory ./TestResults -- --report-trx

    - name: Comment PR with results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: ./TestResults/*.trx
        comment_mode: failures

  # R-18: the desktop app and the updater only built at release time; a broken change now fails here.
  build-desktop:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Build solution
      run: dotnet build ./v2rayN/v2rayN.slnx -c Release
