<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" fill="none">
  <defs>
    <radialGradient id="auroraHero" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0.14"/>
      <stop offset="48%" stop-color="#0E7490" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globeSphere" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#EEF1FF"/>
      <stop offset="88%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </radialGradient>
    <pattern id="dotMap" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.05" fill="#5A67FF" fill-opacity="0.52"/>
    </pattern>
    <clipPath id="globeClip"><circle cx="0" cy="0" r="66"/></clipPath>
    <linearGradient id="quietGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4350F2">
        <animate attributeName="stop-color" values="#4350F2;#5A67FF;#0E7490;#4350F2" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#5A67FF">
        <animate attributeName="stop-color" values="#5A67FF;#0E7490;#4350F2;#5A67FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0E7490">
        <animate attributeName="stop-color" values="#0E7490;#4350F2;#5A67FF;#0E7490" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4350F2"/>
      <stop offset="55%" stop-color="#5A67FF"/>
      <stop offset="80%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F7FF"/>
    </linearGradient>
    <linearGradient id="wingA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#4350F2"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="wingB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4350F2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4350F2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dockClip"><rect x="130" y="336" width="780" height="50" rx="25"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
    @keyframes floatA { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes floatB { 0%,100% { transform: translateY(2px); } 50% { transform: translateY(-4px); } }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes ping { 0% { opacity: 0.85; r: 4; } 100% { opacity: 0; r: 16; } }
    @keyframes glint { 0% { transform: translateX(-220px); } 100% { transform: translateX(880px); } }
    .fA { animation: floatA 4.6s ease-in-out infinite; }
    .fB { animation: floatB 4.6s ease-in-out -1.4s infinite; }
    .dot { animation: dotPulse 2s ease-in-out infinite; }
    .ping { animation: ping 2.4s ease-out infinite; }
    .glint { animation: glint 5s ease-in-out infinite; }
  </style>

  <ellipse cx="520" cy="172" rx="480" ry="155" fill="url(#auroraHero)"/>

  <g transform="translate(520, 152)">
    <g transform="rotate(-13)">
      <path d="M -276 0 A 276 48 0 0 1 276 0" stroke="#4350F2" stroke-opacity="0.22" stroke-width="1.3" stroke-dasharray="10 10" fill="none"/>
      <path id="hOrbA" d="M -276 0 A 276 48 0 1 1 276 0 A 276 48 0 1 1 -276 0 Z" fill="none"/>
      <circle r="3.4" fill="#4350F2"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#hOrbA"/></animateMotion></circle>
    </g>
    <g transform="rotate(11)">
      <path d="M -242 0 A 242 42 0 0 1 242 0" stroke="#0E7490" stroke-opacity="0.24" stroke-width="1.2" fill="none"/>
      <path id="hOrbB" d="M 242 0 A 242 42 0 1 1 -242 0 A 242 42 0 1 1 242 0 Z" fill="none"/>
      <circle r="3.4" fill="#0E7490"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#hOrbB"/></animateMotion></circle>
    </g>
  </g>

  <!-- LEFT 3D FLOATING APP WINDOW STACK (Matches Glide Light Theme!) -->
  <g transform="translate(96, 176)">
    <ellipse cx="0" cy="74" rx="64" ry="14" fill="#283278" opacity="0.14"/>
    <g transform="translate(-10, -8) skewY(-10) scale(0.92, 0.94)">
      <g class="fB">
        <rect x="-62" y="-56" width="124" height="104" rx="16" fill="#F4F6FC" stroke="#D5DCEB" stroke-width="1.2"/>
        <rect x="-50" y="-42" width="38" height="8" rx="4" fill="#E2E8F0"/>
        <rect x="-50" y="-26" width="100" height="22" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="24" y="-20" width="18" height="10" rx="5" fill="#4350F2"/>
      </g>
    </g>
    <g transform="translate(8, 10) skewY(-10)">
      <g class="fA">
        <rect x="-64" y="-52" width="128" height="108" rx="16" fill="#CBD5E1"/>
        <rect x="-64" y="-56" width="128" height="108" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
        <line x1="-48" y1="-55.2" x2="48" y2="-55.2" stroke="url(#rim)" stroke-width="1.3"/>
        <rect x="-58" y="-48" width="24" height="92" rx="8" fill="#F8FAFC"/>
        <circle cx="-46" cy="-36" r="5" fill="#4350F2"/>
        <rect x="-52" y="-22" width="12" height="3" rx="1.5" fill="#94A3B8"/>
        <rect x="-52" y="-13" width="10" height="3" rx="1.5" fill="#CBD5E1"/>
        <rect x="-26" y="-8" width="52" height="18" rx="9" fill="#4350F2"/>
        <circle cx="-16" cy="1" r="3" stroke="#FFFFFF" stroke-width="1.3" fill="none"/>
        <rect x="-9" y="-1" width="24" height="4" rx="2" fill="#FFFFFF"/>
        <circle cx="42" cy="-2" r="14" fill="#EEF2FF" stroke="#818CF8" stroke-width="1"/>
        <rect x="-26" y="20" width="76" height="20" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <circle class="dot" cx="-16" cy="30" r="2.5" fill="#047857"/>
        <text x="14" y="34" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#0E7490">38 ms</text>
      </g>
    </g>
  </g>

  <!-- RIGHT 3D DOTTED GLOBE (Matches hero-stage-light.png Globe!) -->
  <g transform="translate(944, 174)">
    <ellipse cx="0" cy="82" rx="68" ry="12" fill="#283278" opacity="0.14"/>
    <g transform="rotate(-18)">
      <path d="M -86 0 A 86 24 0 0 1 86 0" stroke="#4350F2" stroke-opacity="0.28" stroke-width="1.2" fill="none"/>
      <path id="gOrb" d="M -86 0 A 86 24 0 1 1 86 0 A 86 24 0 1 1 -86 0 Z" fill="none"/>
    </g>
    <g class="fA">
      <circle cx="0" cy="0" r="66" fill="url(#globeSphere)" stroke="#818CF8" stroke-width="1.4"/>
      <g clip-path="url(#globeClip)">
        <path d="M -34 -36 C -14 -42, 10 -46, 36 -38 C 46 -26, 52 -10, 44 10 C 30 22, 18 46, 4 50 C -14 42, -16 14, -8 -4 C -24 -12, -38 -20, -34 -36 Z" fill="url(#dotMap)"/>
        <path d="M -56 -16 C -48 -24, -36 -18, -32 0 C -36 18, -42 36, -54 38 C -62 24, -62 2, -56 -16 Z" fill="url(#dotMap)" opacity="0.8"/>
        <ellipse cx="0" cy="0" rx="66" ry="22" stroke="#4350F2" stroke-opacity="0.16" fill="none"/>
        <ellipse cx="0" cy="0" rx="28" ry="66" stroke="#4350F2" stroke-opacity="0.16" fill="none"/>
        <text x="-44" y="6" class="sans" font-size="13" font-weight="800" fill="#4350F2" fill-opacity="0.18" letter-spacing="1.2">GLIDE</text>
      </g>
      <circle class="ping" cx="12" cy="-14" r="4" stroke="#4350F2" stroke-width="1.3" fill="none"/>
      <circle class="dot" cx="12" cy="-14" r="4" fill="#4350F2"/>
      <circle cx="12" cy="-14" r="2" fill="#FFFFFF"/>
    </g>
    <g transform="rotate(-18)">
      <path d="M 86 0 A 86 24 0 0 1 -86 0" stroke="#0E7490" stroke-opacity="0.48" stroke-width="1.4" fill="none"/>
      <circle r="3.4" fill="#0E7490"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#gOrb"/></animateMotion></circle>
    </g>
  </g>

  <g transform="translate(520, 44)">
    <g transform="translate(-148, 0)"><g class="fB">
      <rect x="-15" y="-15" width="30" height="30" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
      <polygon points="-9,-3 9,-8 -1,1" fill="url(#wingA)"/>
      <polygon points="-1,1 9,-8 3,9" fill="url(#wingB)" stroke="#4350F2" stroke-width="0.6"/>
      <polygon points="-9,-3 -1,1 -4,6" fill="#0E7490" opacity="0.9"/>
    </g></g>
    <rect x="-122" y="-15" width="256" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <line x1="-102" y1="-14.6" x2="114" y2="-14.6" stroke="url(#rim)" stroke-width="1.2"/>
    <circle class="dot" cx="-103" cy="0" r="3.5" fill="#0E7490"/>
    <text x="14" y="4" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#0B0F1D" letter-spacing="1.4">BLACKCORE · GLIDE FOR WINDOWS</text>
  </g>

  <text x="520" y="160" text-anchor="middle" class="sans" font-size="68" font-weight="800" fill="#0B0F1D" letter-spacing="-2.4">Go anywhere. <tspan class="serif" font-style="italic" font-weight="400" font-size="76" letter-spacing="-1" fill="url(#quietGrad)">Quietly.</tspan></text>

  <g transform="translate(520, 152)">
    <g transform="rotate(-13)"><path d="M 276 0 A 276 48 0 0 1 -276 0" stroke="#4350F2" stroke-opacity="0.30" stroke-width="1.5" fill="none"/></g>
    <g transform="rotate(11)"><path d="M 242 0 A 242 42 0 0 1 -242 0" stroke="#0E7490" stroke-opacity="0.34" stroke-width="1.5" fill="none"/></g>
  </g>

  <text x="520" y="232" text-anchor="middle" class="sans" font-size="18.5" font-weight="500" fill="#353F58">A redesigned v2rayN desktop experience crafted in Midnight Aurora.</text>
  <text x="520" y="259" text-anchor="middle" class="sans" font-size="17.5" fill="#566079">Pick a server, press Connect, and verify live exit traffic before calling it online.</text>

  <rect x="130" y="341" width="780" height="50" rx="25" fill="#DCE2F2"/>
  <g clip-path="url(#dockClip)">
    <rect x="130" y="336" width="780" height="50" rx="25" fill="url(#pillBg)"/>
    <rect class="glint" x="130" y="336" width="180" height="50" fill="url(#sheen)"/>
  </g>
  <rect x="130.7" y="336.7" width="778.6" height="48.6" rx="24.3" stroke="#CBD5E1" stroke-width="1.3" fill="none"/>
  <line x1="166" y1="336.7" x2="874" y2="336.7" stroke="url(#rim)" stroke-width="1.5"/>

  <circle class="dot" cx="164" cy="361" r="4" fill="#047857"/>
  <text x="178" y="365" class="mono" font-size="11.5" font-weight="700" fill="#047857">Traffic Verified · 38 ms</text>
  <line x1="364" y1="348" x2="364" y2="374" stroke="#E2E8F0"/>
  <text x="382" y="365" class="sans" font-size="12.5" font-weight="700" fill="#0B0F1D">Ctrl+K Quick Switch</text>
  <line x1="538" y1="348" x2="538" y2="374" stroke="#E2E8F0"/>
  <text x="556" y="365" class="mono" font-size="11.5" font-weight="600" fill="#0E7490">Xray · sing-box · mihomo</text>
  <line x1="744" y1="348" x2="744" y2="374" stroke="#E2E8F0"/>
  <text x="762" y="365" class="sans" font-size="12.5" font-weight="700" fill="#353F58">EN &amp; فارسی</text>
  <line x1="846" y1="348" x2="846" y2="374" stroke="#E2E8F0"/>
  <text x="878" y="365" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#4350F2">GPL-3</text>
</svg>