name: release Glide for Windows

# Builds Glide for 64-bit (x64) and 32-bit (x86) Windows.
# Run it from the Actions tab with a release tag (e.g. 1.0.1) to build, sign and publish.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, e.g. 1.0.1 (empty = build only)'
        required: false
        type: string
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      arches: '["x64", "x86"]'

  public-key:
    if: inputs.release_tag != ''
    uses: ./.github/workflows/pub-key.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  release-zip:
    if: inputs.release_tag != ''
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      arches: '["x64", "x86"]'
    secrets: inherit

  # Glide-setup-<arch>.exe from the same zips (per-user install, Start menu, uninstaller).
  release-installer:
    if: inputs.release_tag != ''
    needs: release-zip
    uses: ./.github/workflows/package-installer.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      arches: '["x64", "x86"]'
    secrets: inherit
