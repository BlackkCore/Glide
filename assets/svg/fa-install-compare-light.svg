<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="308" viewBox="0 0 1040 308" fill="none" role="img" aria-label="مقایسه نسخه نصبی و قابل‌حمل گلاید">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F7FC"/>
    </linearGradient>
    <linearGradient id="rowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF2FA"/>
    </linearGradient>
    <linearGradient id="rimIndigo" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4350F2"/>
      <stop offset="70%" stop-color="#5A67FF"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimTeal" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0E7490"/>
      <stop offset="75%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B77FF"/>
      <stop offset="100%" stop-color="#4350F2"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFE0FF"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Vazirmatn', 'Manrope', 'Segoe UI', Tahoma, -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
    @keyframes floatA { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes floatB { 0%,100% { transform: translateY(1px); } 50% { transform: translateY(-3px); } }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .fA { animation: floatA 4.4s ease-in-out infinite; }
    .fB { animation: floatB 4.4s ease-in-out -1.8s infinite; }
    .dot { animation: dotPulse 2.2s ease-in-out infinite; }
  </style>

  <rect x="540" y="12" width="494" height="290" rx="22" fill="#DCE1F0"/>
  <rect x="535" y="4" width="504" height="290" rx="22" fill="url(#cardBg)" stroke="#CFD6EA" stroke-width="1.2"/>
  <line x1="562" y1="4.5" x2="1012" y2="4.5" stroke="url(#rimIndigo)" stroke-width="1.8"/>

  <rect x="866" y="24" width="148" height="24" rx="12" fill="#EEF0FF" stroke="#B7C0FF" stroke-width="1"/>
  <circle class="dot" cx="1001" cy="36" r="3.5" fill="#4350F2"/>
  <text x="990" y="39.5" text-anchor="end" class="sans" font-size="11" font-weight="700" fill="#313CC9">پیشنهادی</text>
  <text x="878" y="39.5" text-anchor="start" class="mono" font-size="10.5" font-weight="700" fill="#4350F2">.EXE</text>

  <text x="1014" y="76" text-anchor="end" class="sans" font-size="22" font-weight="800" fill="#0B0F1D">نسخهٔ نصبی ویندوز</text>
  <text x="1014" y="99" text-anchor="end" class="sans" font-size="12.5" fill="#566079">نصب استاندارد دسکتاپ با اجرای خودکار در سینی سیستم</text>

  <g transform="translate(598, 58)">
    <g class="fA">
      <ellipse cx="0" cy="4" rx="34" ry="12" transform="rotate(-12)" stroke="#4350F2" stroke-opacity="0.3" stroke-width="1.1" fill="none"/>
      <rect x="-22" y="-17" width="44" height="44" rx="13" fill="#2B35B8"/>
      <rect x="-22" y="-22" width="44" height="44" rx="13" fill="url(#tileGrad)" stroke="#C6CDFF" stroke-width="1"/>
      <path d="M -9 -6 C -1 -9 6 -5 10 3 C 3 0 -4 1 -8 8 C -7 1 -8 -3 -9 -6 Z" fill="url(#wingGrad)"/>
      <path d="M -6 8 C 1 5 6 5 11 9 C 4 10 -1 11 -6 8 Z" fill="#67E8F9"/>
    </g>
  </g>

  <g transform="translate(560, 120)">
    <rect x="0" y="0" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#D4DCF0" stroke-width="1"/>
    <text x="440" y="22" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#566079">مسیر برنامه</text>
    <text x="14" y="22" text-anchor="start" class="mono" font-size="11.5" font-weight="600" fill="#1E296B">%ProgramFiles%\Glide</text>

    <rect x="0" y="44" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#D4DCF0" stroke-width="1"/>
    <text x="440" y="66" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#566079">تنظیمات کاربر</text>
    <text x="14" y="66" text-anchor="start" class="mono" font-size="11.5" font-weight="600" fill="#1E296B">%LOCALAPPDATA%\Glide</text>

    <rect x="0" y="88" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#D4DCF0" stroke-width="1"/>
    <text x="440" y="110" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#566079">یکپارچه‌سازی</text>
    <text x="14" y="110" text-anchor="start" class="mono" font-size="11.5" font-weight="600" fill="#0E7490">Start Menu · Tray · vless://</text>

    <rect x="0" y="132" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#D4DCF0" stroke-width="1"/>
    <text x="440" y="154" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#566079">حذف و پاک‌سازی</text>
    <text x="14" y="154" text-anchor="start" class="sans" font-size="12" font-weight="700" fill="#047857">حذف تمیز از تنظیمات ویندوز</text>
  </g>

  <rect x="6" y="12" width="494" height="290" rx="22" fill="#DCE1F0"/>
  <rect x="1" y="4" width="504" height="290" rx="22" fill="url(#cardBg)" stroke="#CFD6EA" stroke-width="1.2"/>
  <line x1="28" y1="4.5" x2="478" y2="4.5" stroke="url(#rimTeal)" stroke-width="1.8"/>

  <rect x="342" y="24" width="138" height="24" rx="12" fill="#ECFEFF" stroke="#9ADBE8" stroke-width="1"/>
  <circle class="dot" cx="467" cy="36" r="3.5" fill="#0E7490"/>
  <text x="456" y="39.5" text-anchor="end" class="sans" font-size="11" font-weight="700" fill="#0E7490">قابل‌حمل</text>
  <text x="354" y="39.5" text-anchor="start" class="mono" font-size="10.5" font-weight="700" fill="#0E7490">.ZIP</text>

  <text x="480" y="76" text-anchor="end" class="sans" font-size="22" font-weight="800" fill="#0B0F1D">نسخهٔ قابل‌حمل</text>
  <text x="480" y="99" text-anchor="end" class="sans" font-size="12.5" fill="#566079">استخراج در هر پوشه یا حافظهٔ همراه، بدون برجا گذاشتن اثر</text>

  <g transform="translate(64, 58)">
    <g class="fB">
      <ellipse cx="0" cy="4" rx="34" ry="12" transform="rotate(12)" stroke="#0E7490" stroke-opacity="0.3" stroke-width="1.1" fill="none"/>
      <rect x="-24" y="-15" width="48" height="40" rx="12" fill="#C9D6E8"/>
      <rect x="-24" y="-20" width="48" height="40" rx="12" fill="#FFFFFF" stroke="#9ADBE8" stroke-width="1.2"/>
      <rect x="-12" y="-11" width="24" height="7" rx="3.5" fill="#ECFEFF" stroke="#0E7490" stroke-width="0.9"/>
      <rect x="-13" y="2" width="26" height="9" rx="4.5" fill="#ECFDF5" stroke="#047857" stroke-opacity="0.65" stroke-width="1"/>
      <circle cx="-5" cy="6.5" r="2.2" fill="#047857"/>
      <line x1="1" y1="6.5" x2="9" y2="6.5" stroke="#566079" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(26, 120)">
    <rect x="0" y="0" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#D4DCF0" stroke-width="1"/>
    <text x="440" y="22" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#566079">مسیر برنامه</text>
    <text x="14" y="22" text-anchor="start" class="mono" font-size="11.5" font-weight="600" fill="#1E296B">C:\Glide</text>

    <rect x="0" y="44" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#D4DCF0" stroke-width="1"/>
    <text x="440" y="66" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#566079">تنظیمات کاربر</text>
    <text x="14" y="66" text-anchor="start" class="mono" font-size="11.5" font-weight="600" fill="#1E296B">guiConfigs\</text>

    <rect x="0" y="88" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#D4DCF0" stroke-width="1"/>
    <text x="440" y="110" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#566079">ردپا در رجیستری</text>
    <text x="14" y="110" text-anchor="start" class="sans" font-size="12" font-weight="700" fill="#0E7490">صفر — بدون ثبت هیچ کلیدی</text>

    <rect x="0" y="132" width="454" height="36" rx="10" fill="url(#rowBg)" stroke="#D4DCF0" stroke-width="1"/>
    <text x="440" y="154" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#566079">حذف کامل</text>
    <text x="14" y="154" text-anchor="start" class="sans" font-size="12" font-weight="700" fill="#047857">با حذف پوشه کاملاً پاک می‌شود</text>
  </g>
</svg>
