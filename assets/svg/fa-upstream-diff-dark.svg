      <line x1="-6" y1="0" x2="6" y2="0" stroke="#EEF0F8" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round"/>
