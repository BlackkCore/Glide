    <text x="372" y="22" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#0B0F1D">تأیید ترافیک واقعی با سنجش پاسخ خروجی</text>
    <text x="14" y="22" text-anchor="start" class="mono" font-size="10.5" font-weight="700" fill="#047857">38 ms</text>

    <rect x="0" y="44" width="402" height="36" rx="10" fill="url(#chipBg)" stroke="#D4DCF0" stroke-width="1"/>
    <circle cx="386" cy="62" r="3.5" fill="#0E7490"/>
    <text x="372" y="66" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#0B0F1D">پوستهٔ شب و روز به همراه تقویم شمسی</text>
    <text x="14" y="66" text-anchor="start" class="mono" font-size="10.5" font-weight="700" fill="#0E7490">RTL · EN</text>

    <rect x="0" y="88" width="402" height="36" rx="10" fill="url(#chipBg)" stroke="#D4DCF0" stroke-width="1"/>
    <circle cx="386" cy="106" r="3.5" fill="#4350F2"/>
    <text x="372" y="110" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#0B0F1D">جستجوی سریع، منتخب‌ها و منوی سینی</text>
    <text x="14" y="110" text-anchor="start" class="mono" font-size="10.5" font-weight="700" fill="#4350F2">Ctrl+K</text>

    <rect x="0" y="132" width="402" height="24" rx="8" fill="#ECFEFF" stroke="#A5E2EE" stroke-width="1"/>
    <text x="201" y="148" text-anchor="middle" class="mono" font-size="10.5" fill="#0E7490">Ed25519 manifest verification + built-in health check</text>
