PackageIdentifier: BlackkCore.Glide
PackageVersion: 1.1.0
InstallerType: inno
Scope: machine
InstallModes:
  - interactive
  - silent
UpgradeBehavior: install
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/BlackkCore/Glide/releases/download/1.1.0/Glide-setup-x64.exe
