      @keyframes floatB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(5px); } }
      @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes dotP { 0%, 100% { opacity: 0.42; } 50% { opacity: 1; } }
      @keyframes flowArc { from { stroke-dashoffset: 28; } to { stroke-dashoffset: 0; } }
