      .sans { font-family: 'Vazirmatn', 'Manrope', 'Segoe UI', Tahoma, -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
      .floatA { animation: floatA 6.4s ease-in-out infinite; }
      .floatB { animation: floatB 7.2s ease-in-out infinite; }
      .spinSlow { transform-origin: 0px 0px; animation: spinSlow 24s linear infinite; }
      .spinRev { transform-origin: 0px 0px; animation: spinRev 18s linear infinite; }
      .dot { animation: dotP 2.6s ease-in-out infinite; }
      .dot2 { animation: dotP 2.6s ease-in-out 1.2s infinite; }
      .flowArc { stroke-dasharray: 7 7; animation: flowArc 2.8s linear infinite; }
