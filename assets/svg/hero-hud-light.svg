<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="104" viewBox="0 0 1040 104" fill="none">
  <defs>
    <linearGradient id="hudBgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F7FC"/>
    </linearGradient>
    <linearGradient id="subCardL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF2FA"/>
    </linearGradient>
    <linearGradient id="rimL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0"/>
      <stop offset="28%" stop-color="#4350F2"/>
      <stop offset="56%" stop-color="#5A67FF"/>
      <stop offset="82%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="miniGlobeGradL" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#E4E9FF"/>
      <stop offset="100%" stop-color="#5A67FF" stop-opacity="0.72"/>
    </radialGradient>
    <pattern id="miniDotsL" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="0.85" fill="#4350F2" fill-opacity="0.52"/>
    </pattern>
    <linearGradient id="dlAreaL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4350F2" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4350F2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hudClipL"><rect x="1" y="4" width="1038" height="90" rx="24"/></clipPath>
    <clipPath id="globeClipL"><circle cx="0" cy="0" r="21"/></clipPath>
    <clipPath id="nlClipL"><circle cx="0" cy="0" r="14"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
    @keyframes floatMini { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes scan { 0% { transform: translateX(-200px); } 100% { transform: translateX(1180px); } }
    .fM { animation: floatMini 4.2s ease-in-out infinite; }
    .dot { animation: dotPulse 2s ease-in-out infinite; }
    .scan { animation: scan 6.4s linear infinite; }
  </style>

  <!-- 3D Extruded Light Ceramic Base -->
  <rect x="4" y="10" width="1032" height="90" rx="24" fill="#DCE1F0"/>
  <rect x="1" y="4" width="1038" height="90" rx="24" fill="url(#hudBgL)" stroke="#CDD5E8" stroke-width="1.2"/>

  <g clip-path="url(#hudClipL)">
    <rect class="scan" x="0" y="4" width="190" height="90" fill="url(#sheenL)"/>
  </g>

  <line x1="28" y1="4.5" x2="1012" y2="4.5" stroke="url(#rimL)" stroke-width="1.8"/>

  <!-- Zone 1: Mini 3D Dotted Aurora Globe -->
  <g transform="translate(48, 49)">
    <g class="fM">
      <circle cx="0" cy="0" r="24" fill="#4350F2" fill-opacity="0.10"/>
      <circle cx="0" cy="0" r="21" fill="url(#miniGlobeGradL)"/>
      <g clip-path="url(#globeClipL)">
        <circle cx="0" cy="0" r="21" fill="url(#miniDotsL)"/>
        <path d="M -22 6 C -8 2 8 2 22 6 L 22 22 L -22 22 Z" fill="#DDE2F7" fill-opacity="0.62"/>
      </g>
      <circle cx="0" cy="0" r="21" stroke="#4350F2" stroke-opacity="0.55" stroke-width="1.1"/>
      <ellipse cx="0" cy="2" rx="26" ry="7.5" transform="rotate(-14)" stroke="#0E7490" stroke-opacity="0.45" stroke-width="1" fill="none"/>
      <path id="hudOrbitL" d="M -26 2 A 26 7.5 -14 1 1 26 2 A 26 7.5 -14 1 1 -26 2 Z" fill="none"/>
      <circle r="2.2" fill="#0E7490"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#hudOrbitL"/></animateMotion></circle>
    </g>
  </g>

  <g transform="translate(82, 34)">
    <circle class="dot" cx="5" cy="7" r="4" fill="#047857"/>
    <text x="16" y="11" class="sans" font-size="13.5" font-weight="700" fill="#0B0F1D">Traffic Verified</text>
    <text x="0" y="30" class="mono" font-size="10.5" fill="#566079">TUN · Direct Local DNS</text>
  </g>

  <line x1="234" y1="22" x2="234" y2="76" stroke="#DCE1EF" stroke-width="1"/>

  <!-- Zone 2: Active Server Row Card -->
  <g transform="translate(248, 21)">
    <rect x="0" y="3" width="298" height="56" rx="16" fill="#D5DCEF"/>
    <rect x="0" y="0" width="298" height="56" rx="16" fill="url(#subCardL)" stroke="#CFD6EA" stroke-width="1"/>
    <g transform="translate(27, 28)">
      <g clip-path="url(#nlClipL)">
        <rect x="-14" y="-14" width="28" height="9.4" fill="#AE1C28"/>
        <rect x="-14" y="-4.6" width="28" height="9.2" fill="#FFFFFF"/>
        <rect x="-14" y="4.6" width="28" height="9.4" fill="#21468B"/>
      </g>
      <circle cx="0" cy="0" r="14" stroke="#0B0F1D" stroke-opacity="0.16" stroke-width="1"/>
    </g>
    <text x="52" y="24" class="sans" font-size="13.5" font-weight="700" fill="#0B0F1D">Netherlands</text>
    <text x="52" y="41" class="mono" font-size="10.5" fill="#566079">Amsterdam · VLESS · tcp</text>

    <rect x="218" y="13" width="66" height="30" rx="15" fill="#E6F6F9" stroke="#0E7490" stroke-opacity="0.35" stroke-width="1"/>
    <text x="251" y="32" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#0E7490">38 ms</text>
  </g>

  <!-- Zone 3: Smooth Aurora Throughput Curve & Equalizer -->
  <g transform="translate(564, 18)">
    <text x="0" y="15" class="mono" font-size="10" letter-spacing="0.8" fill="#566079">LIVE THROUGHPUT</text>
    <text x="0" y="41" class="sans" font-size="15.5" font-weight="800" fill="#0B0F1D">412 <tspan font-size="11" font-weight="600" fill="#0E7490">Mbps ↓</tspan></text>
    <text x="0" y="57" class="mono" font-size="10" fill="#4350F2">↑ 148 Mbps  ·  0% loss</text>

    <g transform="translate(104, 10)">
      <path d="M 0 36 C 18 32 28 16 44 20 C 60 24 72 8 92 12 C 108 15 118 22 132 10 L 132 42 L 0 42 Z" fill="url(#dlAreaL)"/>
      <path id="dlWaveL" d="M 0 36 C 18 32 28 16 44 20 C 60 24 72 8 92 12 C 108 15 118 22 132 10" stroke="#0E7490" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 0 39 C 22 36 38 28 56 30 C 76 32 94 23 114 25 L 132 22" stroke="#4350F2" stroke-opacity="0.65" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <circle r="3" fill="#4350F2"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#dlWaveL"/></animateMotion></circle>
      <g transform="translate(142, 6)">
        <rect x="0" y="14" width="3.5" height="22" rx="1.7" fill="#4350F2">
          <animate attributeName="height" values="10;26;14;22;10" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="y" values="26;10;22;14;26" dur="1.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="6" y="8" width="3.5" height="28" rx="1.7" fill="#5A67FF">
          <animate attributeName="height" values="22;12;28;16;22" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="14;24;8;20;14" dur="1.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="12" y="18" width="3.5" height="18" rx="1.7" fill="#0E7490">
          <animate attributeName="height" values="16;28;12;24;16" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="y" values="20;8;24;12;20" dur="1.8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <line x1="836" y1="22" x2="836" y2="76" stroke="#DCE1EF" stroke-width="1"/>

  <!-- Zone 4: Ctrl K Keycap + Signed 3 Engines Pill -->
  <g transform="translate(852, 23)">
    <rect x="0" y="0" width="54" height="24" rx="7" fill="#EDF0FA" stroke="#C6CFE6" stroke-width="1"/>
    <text x="27" y="15.5" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#353F58">Ctrl K</text>
    <text x="64" y="15.5" class="sans" font-size="11.5" font-weight="600" fill="#566079">Quick Switch</text>

    <rect x="0" y="31" width="170" height="22" rx="11" fill="#ECEFFF" stroke="#4350F2" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="13" cy="42" r="3" fill="#047857"/>
    <text x="23" y="45.5" class="mono" font-size="10" font-weight="600" fill="#1E2B7A">3 Engines · Ed25519 Signed</text>
  </g>
</svg>