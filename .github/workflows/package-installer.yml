name: package and release installer

# Turns each release zip into Glide-setup-<arch>.exe (Inno Setup, per-user install), then signs and
# uploads it to the release like the zips.

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      arches: # JSON list: x64 and/or x86
        required: false
        type: string
        default: '["x64", "x86"]'
    secrets:
      GPG_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  actions: read

jobs:
  package:
    name: installer ${{ matrix.arch }}
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    runs-on: windows-latest
    steps:
    - name: Checkout installer script
      uses: actions/checkout@v7
      with:
        sparse-checkout: installer

    - name: Restore release zip
      uses: actions/download-artifact@v8
      with:
        name: release-windows-${{ matrix.arch }}
        path: zip

    - name: Build installer
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Expand-Archive "zip/Glide-windows-${{ matrix.arch }}.zip" -DestinationPath unpacked
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          choco install innosetup -y --no-progress
        }
        $version = '${{ inputs.release_tag }}'.TrimStart('v')
        & $iscc "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" "/DSourceDir=$PWD\unpacked\Glide" "/O$PWD\dist" installer\glide.iss
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
        Get-ChildItem dist

    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-installer-${{ matrix.arch }}
        path: dist/Glide-setup-${{ matrix.arch }}.exe
        if-no-files-found: error

  release:
    name: sign and upload installer ${{ matrix.arch }}
    needs: package
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: release-installer-${{ matrix.arch }}
      file_pattern: '*.exe'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
