<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="308" viewBox="0 0 1040 308" fill="none" role="img" aria-label="روند ۵ مرحله‌ای راستی‌آزمایی زنده ترافیک گلاید">
  <defs>
    <linearGradient id="outerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F7FC"/>
    </linearGradient>
    <linearGradient id="stageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF2FA"/>
    </linearGradient>
    <linearGradient id="stageWinBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#E1F7EE"/>
    </linearGradient>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0"/>
      <stop offset="28%" stop-color="#4350F2"/>
      <stop offset="56%" stop-color="#5A67FF"/>
      <stop offset="82%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#4350F2"/>
      <stop offset="50%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="engSphere" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#EEF1FF"/>
      <stop offset="68%" stop-color="#D4DCFA"/>
      <stop offset="100%" stop-color="#5A67FF"/>
    </radialGradient>
    <pattern id="engDots" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="0.8" fill="#4350F2" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="engClip"><circle cx="0" cy="0" r="21"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Vazirmatn', 'Manrope', 'Segoe UI', Tahoma, -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
    @keyframes floatSoft { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .f1 { animation: floatSoft 4.2s ease-in-out 0s infinite; }
    .f2 { animation: floatSoft 4.2s ease-in-out -0.8s infinite; }
    .f3 { animation: floatSoft 4.2s ease-in-out -1.6s infinite; }
    .f4 { animation: floatSoft 4.2s ease-in-out -2.4s infinite; }
    .f5 { animation: floatSoft 4.2s ease-in-out -3.2s infinite; }
    .dot { animation: dotPulse 2s ease-in-out infinite; }
  </style>

  <rect x="6" y="12" width="1028" height="288" rx="24" fill="#DCE1F0"/>
  <rect x="1" y="4" width="1038" height="288" rx="24" fill="url(#outerBg)" stroke="#CFD6EA" stroke-width="1.2"/>
  <line x1="28" y1="4.5" x2="1012" y2="4.5" stroke="url(#rim)" stroke-width="1.8"/>

  <text x="1014" y="40" text-anchor="end" class="sans" font-size="20" font-weight="800" fill="#0B0F1D">راستی‌آزمایی زندهٔ تونل</text>
  <text x="1014" y="63" text-anchor="end" class="sans" font-size="13" fill="#566079">هر اتصال پیش از نمایش وضعیت سبز، از دریافت محلی، مسیریابی هسته، قوانین مسیر و آزمایش واقعی عبور خروجی می‌گذرد</text>

  <rect x="26" y="24" width="200" height="26" rx="13" fill="#ECFDF5" stroke="#98DAC2" stroke-width="1"/>
  <circle class="dot" cx="211" cy="37" r="3.5" fill="#047857"/>
  <text x="199" y="41" text-anchor="end" class="sans" font-size="10.5" font-weight="700" fill="#065F46">تأیید سراسری</text>
  <text x="40" y="41" text-anchor="start" class="mono" font-size="10.5" font-weight="700" fill="#047857">38 ms</text>

  <path id="vPipe" d="M 926 178 L 114 178" stroke="url(#pipeGrad)" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
  <circle r="4" fill="#4350F2"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#vPipe"/></animateMotion></circle>
  <circle r="4" fill="#0E7490"><animateMotion dur="3.4s" begin="1.15s" repeatCount="indefinite"><mpath href="#vPipe"/></animateMotion></circle>
  <circle r="4" fill="#047857"><animateMotion dur="3.4s" begin="2.3s" repeatCount="indefinite"><mpath href="#vPipe"/></animateMotion></circle>

  <g transform="translate(828, 92)">
    <rect x="3" y="6" width="180" height="176" rx="18" fill="#D5DCEF"/>
    <rect x="0" y="0" width="186" height="176" rx="18" fill="url(#stageBg)" stroke="#C8D0E6" stroke-width="1.1"/>
    <g transform="translate(93, 52)">
      <g class="f1">
        <rect x="-24" y="-17" width="48" height="34" rx="10" fill="#B7C2EE"/>
        <rect x="-24" y="-21" width="48" height="34" rx="10" fill="#EEF1FF" stroke="#4350F2" stroke-width="1.3"/>
        <path d="M -10 -4 L 0 -10 L 10 -4 L 10 3 C 10 8 0 11 0 11 C 0 11 -10 8 -10 3 Z" fill="#4350F2" stroke="#C6CDFF" stroke-width="1"/>
        <circle class="dot" cx="0" cy="0" r="2.5" fill="#67E8F9"/>
      </g>
    </g>
    <text x="93" y="108" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#4350F2">۰۱ · دریافت</text>
    <text x="93" y="130" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#0B0F1D">تونل و پراکسی</text>
    <text x="93" y="150" text-anchor="middle" class="sans" font-size="11.5" fill="#566079">دریافت ترافیک و درخواست نام‌ها</text>
  </g>

  <g transform="translate(627, 92)">
    <rect x="3" y="6" width="180" height="176" rx="18" fill="#D5DCEF"/>
    <rect x="0" y="0" width="186" height="176" rx="18" fill="url(#stageBg)" stroke="#C8D0E6" stroke-width="1.1"/>
    <g transform="translate(93, 52)">
      <g class="f2">
        <circle cx="0" cy="0" r="21" fill="url(#engSphere)"/>
        <g clip-path="url(#engClip)"><circle cx="0" cy="0" r="21" fill="url(#engDots)"/></g>
        <circle cx="0" cy="0" r="21" stroke="#4350F2" stroke-width="1.2"/>
        <ellipse cx="0" cy="0" rx="30" ry="9" transform="rotate(-16)" stroke="#0E7490" stroke-opacity="0.65" stroke-width="1.1" fill="none"/>
        <path id="s2orb" d="M -30 0 A 30 9 -16 1 1 30 0 A 30 9 -16 1 1 -30 0 Z" fill="none"/>
        <circle r="2.4" fill="#0B0F1D"><animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#s2orb"/></animateMotion></circle>
      </g>
    </g>
    <text x="93" y="108" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#4350F2">۰۲ · هسته</text>
    <text x="93" y="130" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#0B0F1D">مسیریاب مرکزی</text>
    <text x="93" y="150" text-anchor="middle" class="mono" font-size="10.5" fill="#566079">Xray · sing-box · mihomo</text>
  </g>

  <g transform="translate(426, 92)">
    <rect x="3" y="6" width="180" height="176" rx="18" fill="#D5DCEF"/>
    <rect x="0" y="0" width="186" height="176" rx="18" fill="url(#stageBg)" stroke="#C8D0E6" stroke-width="1.1"/>
    <g transform="translate(93, 52)">
      <g class="f3">
        <rect x="-26" y="-20" width="44" height="24" rx="7" fill="#EEF0FF" stroke="#B7C0FF" stroke-width="1"/>
        <rect x="-20" y="-12" width="44" height="24" rx="7" fill="#FFFFFF" stroke="#5A67FF" stroke-opacity="0.7" stroke-width="1"/>
        <rect x="-14" y="-4" width="44" height="24" rx="7" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.2"/>
        <circle cx="-4" cy="8" r="2.5" fill="#0E7490"/>
        <line x1="4" y1="8" x2="21" y2="8" stroke="#0E7490" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    <text x="93" y="108" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#0E7490">۰۳ · قوانین</text>
    <text x="93" y="130" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#0B0F1D">سیاست مسیریابی</text>
    <text x="93" y="150" text-anchor="middle" class="sans" font-size="11.5" fill="#566079">تفکیک داخلی و ترافیک تونل</text>
  </g>

  <g transform="translate(225, 92)">
    <rect x="3" y="6" width="180" height="176" rx="18" fill="#D5DCEF"/>
    <rect x="0" y="0" width="186" height="176" rx="18" fill="url(#stageBg)" stroke="#C8D0E6" stroke-width="1.1"/>
    <g transform="translate(93, 52)">
      <g class="f4">
        <circle cx="0" cy="0" r="22" stroke="#0E7490" stroke-opacity="0.25" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="14" stroke="#0E7490" stroke-opacity="0.55" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="8" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5">
          <animate attributeName="r" values="8;23" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.85;0" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="5" fill="#0E7490"/>
      </g>
    </g>
    <text x="93" y="108" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#0E7490">۰۴ · آزمایش</text>
    <text x="93" y="130" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#0B0F1D">سنجش خروجی</text>
    <text x="93" y="150" text-anchor="middle" class="sans" font-size="11.5" fill="#566079">آزمایش واقعی عبور بسته</text>
  </g>

  <g transform="translate(24, 92)">
    <rect x="3" y="6" width="180" height="176" rx="18" fill="#C7E4D8"/>
    <rect x="0" y="0" width="186" height="176" rx="18" fill="url(#stageWinBg)" stroke="#74C6A3" stroke-width="1.2"/>
    <g transform="translate(93, 52)">
      <g class="f5">
        <circle cx="0" cy="0" r="22" fill="#ECFDF5" stroke="#047857" stroke-opacity="0.4" stroke-width="1.2">
          <animate attributeName="r" values="18;26" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <rect x="-32" y="-14" width="64" height="32" rx="16" fill="#065F46"/>
        <rect x="-32" y="-17" width="64" height="32" rx="16" fill="#047857" stroke="#A7F3D0" stroke-width="1.1"/>
        <text x="0" y="3" text-anchor="middle" class="mono" font-size="12" font-weight="800" fill="#FFFFFF">38 ms</text>
      </g>
    </g>
    <text x="93" y="108" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#047857">۰۵ · تأییدشده</text>
    <text x="93" y="130" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#0B0F1D">ترافیک واقعی تأیید شد</text>
    <text x="93" y="150" text-anchor="middle" class="sans" font-size="11.5" fill="#065F46">آماده برای همهٔ برنامه‌ها</text>
  </g>
</svg>
