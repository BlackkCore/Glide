<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="296" viewBox="0 0 1040 296" fill="none" role="img" aria-label="تفاوت گلاید با هسته اصلی v2rayN">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F7FC"/>
    </linearGradient>
    <linearGradient id="chipBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF2FA"/>
    </linearGradient>
    <linearGradient id="rimIndigo" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#4350F2" stop-opacity="0"/>
      <stop offset="35%" stop-color="#4350F2"/>
      <stop offset="75%" stop-color="#5A67FF"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimAurora" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#5A67FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#4350F2"/>
      <stop offset="70%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlobe" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#EEF1FF"/>
      <stop offset="68%" stop-color="#D4DCFA"/>
      <stop offset="100%" stop-color="#5A67FF"/>
    </radialGradient>
    <pattern id="coreDots" width="4.5" height="4.5" patternUnits="userSpaceOnUse">
      <circle cx="1.8" cy="1.8" r="0.9" fill="#4350F2" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="coreGlobeClip"><circle cx="0" cy="0" r="34"/></clipPath>
