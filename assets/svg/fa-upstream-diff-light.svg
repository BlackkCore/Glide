  <style>
    .sans { font-family: 'Vazirmatn', 'Manrope', 'Segoe UI', Tahoma, -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace; }
    @keyframes floatMid { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .fMid { animation: floatMid 4.2s ease-in-out infinite; }
    .dot { animation: dotPulse 2.2s ease-in-out infinite; }
  </style>

  <path id="fuseA" d="M 598 104 C 558 104 552 148 520 148 C 488 148 482 104 442 104" stroke="#4350F2" stroke-opacity="0.35" stroke-width="1.8" fill="none"/>
  <path id="fuseB" d="M 598 148 L 442 148" stroke="#5A67FF" stroke-opacity="0.55" stroke-width="2.2" fill="none"/>
  <path id="fuseC" d="M 598 192 C 558 192 552 148 520 148 C 488 148 482 192 442 192" stroke="#0E7490" stroke-opacity="0.4" stroke-width="1.8" fill="none"/>

