<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 76" width="1040" height="76" role="img" aria-label="Animated Glide verification flow">
  <defs>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#4350f2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4350f2" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="pulseGlow">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="1038" height="74" rx="16" fill="#ffffff" stroke="#d8dce8"/>
  <line x1="150" y1="38" x2="890" y2="38" stroke="url(#gLine)" stroke-width="2" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <circle cx="150" cy="38" r="9" fill="url(#pulseGlow)">
    <animate attributeName="cx" values="890;150" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="38" r="3.5" fill="#ffffff">
    <animate attributeName="cx" values="890;150" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <g font-family="Vazirmatn, Tahoma, Segoe UI, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
    <rect x="34" y="18" width="142" height="40" rx="10" fill="#ecfeff" stroke="#0e7490"/>
    <text x="105" y="42" fill="#0e7490">خروجی تأییدشده</text>
    <rect x="295" y="18" width="160" height="40" rx="10" fill="#f5f6fa" stroke="#4350f2"/>
    <text x="375" y="42" fill="#0b0f1d">بررسی ترافیک</text>
    <rect x="575" y="18" width="170" height="40" rx="10" fill="#f5f6fa" stroke="#4350f2"/>
    <text x="660" y="42" fill="#0b0f1d">تونل گلاید</text>
    <rect x="864" y="18" width="142" height="40" rx="10" fill="#f5f6fa" stroke="#cfd5e6"/>
    <text x="935" y="42" fill="#0b0f1d">برنامه‌های شما</text>
  </g>
</svg>